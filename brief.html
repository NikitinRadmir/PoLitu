<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/brief.css">
    <title>Document</title>
</head>
<header>
    <nav class="navbar navbar-expand">
        <div class="container-fluid">
            <div class="navbar-collapse justify-content-end col-7" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="portfolio.html">Портфолио</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">О нас</a>
                    </li>
                </ul>
            </div>
            <div class="navbar-buttons d-flex justify-content-start col-5">
                <button class="btn btn-custom mr-2">Оставить заявку</button>
                <button class="btn btn-custom active-button">Заполнить бриф</button>
            </div>
        </div>
    </nav>
</header>
<body>

<div class="application-form pt-5">
        <section class="contact-info mb-4 justify-content-center pt-4">
            <form id="application-form">
                <div class="form-group">
                    <input type="text" class="form-control" id="fullname" name="fullname" placeholder="1. Имя" required>
                </div>
                <div class="form-group">
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="2. Телефон" required>
                </div>
                <div class="form-group">
                    <input type="email" class="form-control" id="email" name="email" placeholder="3. Электронная почта" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="todo" name="todo" placeholder="4. Что требуется сделать" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="company" name="company" placeholder="5. Расскажите о компании или продукте" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="audience" name="audience" placeholder="6. Расскажите о целевой аудитории" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="channel" name="channel" placeholder="7. Расскажите про канал коммуникации" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="time" name="time" placeholder="8. Требуемый хронометраж" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="date" name="date" onfocus="(this.type='date')" onblur="(this.value == '') ? this.type='text' : this.type='date'" placeholder="9. К какому сроку нужно сдать проект" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="budget" name="budget" placeholder="10. Примерный бюджет проекта" required>
                </div>
                <div class="d-flex justify-content-center mt-5">
                    <button type="submit" class="btn btn-primary col-5 btn-send">Отправить</button>
                </div>
            </form>
            
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
