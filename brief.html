<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">

    <title>Document</title>
</head>
<header>
    <nav class="navbar navbar-expand">
        <div class="container-fluid">
            <div class="navbar-collapse justify-content-end col-7" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Портфолио</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">О нас</a>
                    </li>
                </ul>
            </div>
            <div class="navbar-buttons d-flex justify-content-start col-5">
                <button class="btn btn-custom mr-2">Оставить заявку</button>
                <button class="btn btn-custom">Заполнить бриф</button>
            </div>
        </div>

</header>
<body>

<div class="application-form">
        <section class="contact-info mb-4 justify-content-center">
            <form id="application-form">
                <div class="form-group">
                    <input type="text" class="form-control" id="fullname" name="fullname" placeholder="1. Фамилия Имя Отчество" required>
                </div>
                <div class="form-group">
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="2. Телефон" required>
                </div>
                <div class="form-group">
                    <input type="email" class="form-control" id="email" name="email" placeholder="3. Электронная почта" required>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary col-5">Оставить заявку</button>
                </div>
            </form>
            
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
